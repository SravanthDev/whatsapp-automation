<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Automation Demo – Powered by Cezen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #0a0e27 0%, #0d1545 50%, #0a0e27 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 1.5rem 1rem 2rem;
    }

    /* ── Top branding bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 1.2rem;
    }
    .top-bar img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.25);
    }
    .top-bar-text {
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .top-bar-text span {
      color: #00a884;
    }

    /* ── Scenario selector ── */
    .label {
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 0.6rem;
    }
    .scenario-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
    }
    .sc-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      cursor: pointer;
      transition: all 0.15s;
    }
    .sc-btn:hover { background: rgba(0,168,132,0.2); border-color: #00a884; color: #fff; }
    .sc-btn.active { background: #00a884; color: #fff; border-color: #00a884; }

    /* ── Phone shell ── */
    .phone-wrap { display: flex; justify-content: center; }
    .phone {
      width: 320px;
      background: #111;
      border-radius: 42px;
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px #333;
    }
    .phone-screen {
      background: #0b141a;
      border-radius: 32px;
      overflow: hidden;
      /* KEY FIX: fixed height + flex so chat body can scroll */
      height: 600px;
      display: flex;
      flex-direction: column;
    }

    /* ── WhatsApp header ── */
    .wa-header {
      background: #202c33;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;   /* never shrink – stays at top */
    }
    .wa-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #25d366;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .wa-name  { color: #e9edef; font-size: 14px; font-weight: 500; }
    .wa-status{ color: #8696a0; font-size: 11px; }

    /* ── Chat body – THIS is the scrollable area ── */
    .wa-body {
      flex: 1;              /* takes remaining height */
      overflow-y: auto;     /* scroll here, not on phone-screen */
      overflow-x: hidden;
      padding: 10px 10px 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #0b141a;
      /* custom scrollbar */
      scrollbar-width: thin;
      scrollbar-color: #2a3942 transparent;
    }
    .wa-body::-webkit-scrollbar { width: 4px; }
    .wa-body::-webkit-scrollbar-track { background: transparent; }
    .wa-body::-webkit-scrollbar-thumb { background: #2a3942; border-radius: 4px; }

    /* ── Messages ── */
    .msg-row { display: flex; flex-direction: column; }
    .msg-row.sent  { align-items: flex-end; }
    .msg-row.recv  { align-items: flex-start; }

    .bubble {
      max-width: 82%;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      line-height: 1.55;
      word-break: break-word;
    }
    .bubble.sent { background: #005c4b; color: #e9edef; border-top-right-radius: 2px; }
    .bubble.recv { background: #202c33; color: #e9edef; border-top-left-radius: 2px; }
    .bubble .time {
      font-size: 10px; color: #8696a0;
      float: right; margin-left: 10px; margin-top: 4px;
    }

    /* ── Quick-reply buttons ── */
    .btn-group {
      background: #202c33;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 2px;
      max-width: 82%;
    }
    .wa-btn {
      width: 100%; background: none; border: none;
      border-top: 0.5px solid #2a3942;
      color: #00a884; font-size: 12.5px;
      padding: 9px 12px; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: background 0.15s;
      text-align: left;
    }
    .wa-btn:first-child { border-top: none; }
    .wa-btn:hover:not(:disabled) { background: #2a3942; }
    .wa-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .wa-btn i { font-size: 14px; flex-shrink: 0; }

    /* ── Input bar ── */
    .wa-input-bar {
      background: #202c33;
      padding: 8px 10px;
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;  /* stays at bottom */
    }
    .wa-input {
      flex: 1; background: #2a3942; border: none;
      border-radius: 20px; padding: 8px 14px;
      color: #e9edef; font-size: 13px; outline: none; cursor: not-allowed;
    }
    .wa-input::placeholder { color: #8696a0; }
    .wa-send {
      width: 36px; height: 36px; border-radius: 50%;
      background: #00a884; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }

    /* ── Typing dots ── */
    .typing {
      display: flex; align-items: center; gap: 4px;
      padding: 8px 12px; background: #202c33;
      border-radius: 8px; width: fit-content;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #8696a0; animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%          { transform: translateY(-6px); }
    }

    /* ── Bottom controls ── */
    .bottom-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 1.2rem;
    }
    .reset-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 7px 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      transition: all 0.15s;
    }
    .reset-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }

    /* ── Footer branding ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 1.8rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .footer img {
      width: 24px; height: 24px;
      border-radius: 50%; object-fit: cover;
    }
    .footer-text {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }
    .footer-text strong { color: rgba(255,255,255,0.7); font-weight: 600; }
  </style>
</head>

    let currentScenario = 'restaurant';
    let waitingForReply = false;

    function loadScenario(key, btn) {
      currentScenario = key;
      waitingForReply = false;
      document.querySelectorAll('.sc-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const s = scenarios[key];
      document.getElementById('biz-name').textContent = s.name;
      document.getElementById('biz-avatar').textContent = s.avatar;
      const body = document.getElementById('chat-body');
      body.innerHTML = '';
      setTimeout(() => addRecvMsg(s.welcome, true), 300);
    }

    function resetChat() {
      waitingForReply = false;
      const body = document.getElementById('chat-body');
      body.innerHTML = '';
      setTimeout(() => addRecvMsg(scenarios[currentScenario].welcome, true), 300);
    }

    function addSentMsg(text) {
      const body = document.getElementById('chat-body');
      const row = document.createElement('div');
      row.className = 'msg-row sent';
      const bubble = document.createElement('div');
      bubble.className = 'bubble sent';
      bubble.innerHTML = fmt(text) + '<span class="time">now ✓✓</span>';
      row.appendChild(bubble);
      body.appendChild(row);
      body.scrollTop = body.scrollHeight;
    }

    function addRecvMsg(text, withButtons) {
      const body = document.getElementById('chat-body');
      const s = scenarios[currentScenario];
      const row = document.createElement('div');
      row.className = 'msg-row recv';
      const bubble = document.createElement('div');
      bubble.className = 'bubble recv';
      bubble.innerHTML = fmt(text) + '<span class="time">now</span>';
      row.appendChild(bubble);
      body.appendChild(row);
      if (withButtons) {
        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group';
        s.buttons.forEach(b => {
          const btn = document.createElement('button');
          btn.className = 'wa-btn';
          btn.innerHTML = `<i class="ti ti-corner-up-left" aria-hidden="true"></i>${b.label}`;
          btn.onclick = () => handleBtn(b.id, b.label, btnGroup);
          btnGroup.appendChild(btn);
        });
        body.appendChild(btnGroup);
      }
      body.scrollTop = body.scrollHeight;
    }

    function handleBtn(id, label, btnGroup) {
      if (waitingForReply) return;
      waitingForReply = true;
      btnGroup.querySelectorAll('.wa-btn').forEach(b => b.disabled = true);
      addSentMsg(label);
      const body = document.getElementById('chat-body');
      const typingRow = document.createElement('div');
      typingRow.className = 'msg-row recv';
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
      typingRow.appendChild(typing);
      body.appendChild(typingRow);
      body.scrollTop = body.scrollHeight;
      setTimeout(() => {
        body.removeChild(typingRow);
        addRecvMsg(scenarios[currentScenario].replies[id], false);
        setTimeout(() => {
          addRecvMsg("Is there anything else I can help you with? 😊", true);
          waitingForReply = false;
        }, 800);
      }, 1500);
    }

    function fmt(text) {
      return text
        .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    loadScenario('restaurant', document.querySelector('.sc-btn.active'));
  </script>

</body>
