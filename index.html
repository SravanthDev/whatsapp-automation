<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Automation Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; padding: 1rem 0 2rem; }

    .label { text-align: center; font-size: 13px; color: #555; padding: 1rem 0 0.5rem; }

    .scenario-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0.5rem 1rem 1rem; }
    .sc-btn { background: #fff; border: 1px solid #ccc; border-radius: 20px; padding: 7px 16px; font-size: 13px; color: #444; cursor: pointer; transition: all 0.15s; }
    .sc-btn:hover { background: #e8f5e9; border-color: #00a884; color: #00a884; }
    .sc-btn.active { background: #00a884; color: #fff; border-color: #00a884; }

    .phone-wrap { display: flex; justify-content: center; padding: 0.5rem 0 2rem; }
    .phone { width: 320px; background: #1a1a1a; border-radius: 40px; padding: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
    .phone-screen { background: #0b141a; border-radius: 30px; overflow: hidden; height: 580px; display: flex; flex-direction: column; }

    .wa-header { background: #202c33; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
    .wa-avatar { width: 36px; height: 36px; border-radius: 50%; background: #25d366; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #fff; flex-shrink: 0; }
    .wa-name { color: #e9edef; font-size: 14px; font-weight: 500; }
    .wa-status { color: #8696a0; font-size: 11px; }

    .wa-body { flex: 1; overflow-y: auto; padding: 10px 10px 6px; display: flex; flex-direction: column; gap: 8px; background: #0b141a; }
    .wa-body::-webkit-scrollbar { width: 4px; }
    .wa-body::-webkit-scrollbar-thumb { background: #2a3942; border-radius: 2px; }

    .msg-row { display: flex; flex-direction: column; }
    .msg-row.sent { align-items: flex-end; }
    .msg-row.recv { align-items: flex-start; }

    .bubble { max-width: 82%; padding: 7px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.5; position: relative; word-break: break-word; }
    .bubble.sent { background: #005c4b; color: #e9edef; border-top-right-radius: 2px; }
    .bubble.recv { background: #202c33; color: #e9edef; border-top-left-radius: 2px; }
    .bubble .time { font-size: 10px; color: #8696a0; float: right; margin-left: 8px; margin-top: 4px; }

    .btn-group { background: #202c33; border-radius: 8px; overflow: hidden; margin-top: 2px; max-width: 82%; }
    .wa-btn { width: 100%; background: none; border: none; border-top: 0.5px solid #2a3942; color: #00a884; font-size: 12.5px; padding: 9px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.15s; }
    .wa-btn:first-child { border-top: none; }
    .wa-btn:hover:not(:disabled) { background: #2a3942; }
    .wa-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .wa-btn i { font-size: 14px; }

    .wa-input-bar { background: #202c33; padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
    .wa-input { flex: 1; background: #2a3942; border: none; border-radius: 20px; padding: 8px 14px; color: #e9edef; font-size: 13px; outline: none; cursor: not-allowed; }
    .wa-input::placeholder { color: #8696a0; }
    .wa-send { width: 36px; height: 36px; border-radius: 50%; background: #00a884; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

    .typing { display: flex; align-items: center; gap: 4px; padding: 8px 12px; background: #202c33; border-radius: 8px; width: fit-content; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #8696a0; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    .reset-btn { display: block; margin: 0 auto; background: none; border: 1px solid #ccc; border-radius: 20px; padding: 6px 20px; font-size: 12px; color: #666; cursor: pointer; transition: all 0.15s; }
    .reset-btn:hover { border-color: #00a884; color: #00a884; }
  </style>
</head>
<body>

  <div class="label">👇 Tap a business type, then tap the buttons inside the phone to see auto-replies</div>

  <div class="scenario-bar">
    <button class="sc-btn active" onclick="loadScenario('restaurant', this)">🍽️ Restaurant</button>
    <button class="sc-btn" onclick="loadScenario('salon', this)">💇 Salon / Spa</button>
    <button class="sc-btn" onclick="loadScenario('clinic', this)">🏥 Clinic</button>
    <button class="sc-btn" onclick="loadScenario('retail', this)">🛍️ Retail Shop</button>
  </div>

  <div class="phone-wrap">
    <div class="phone">
      <div class="phone-screen">
        <div class="wa-header">
          <div class="wa-avatar" id="biz-avatar">SG</div>
          <div>
            <div class="wa-name" id="biz-name">Spice Garden Restaurant</div>
            <div class="wa-status">Business account ✓</div>
          </div>
        </div>
        <div class="wa-body" id="chat-body"></div>
        <div class="wa-input-bar">
          <input class="wa-input" placeholder="Type a message" readonly />
          <button class="wa-send" aria-label="Send message">
            <i class="ti ti-send" style="color:#fff; font-size:16px;"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <button class="reset-btn" onclick="resetChat()">↺ Reset chat</button>

  <script>
    const scenarios = {
      restaurant: {
        name: "Spice Garden Restaurant",
        avatar: "SG",
        welcome: "👋 Welcome to *Spice Garden*! How can we help you today?",
        buttons: [
          { id: "menu",  label: "View our menu" },
          { id: "book",  label: "Book a table" },
          { id: "hours", label: "Timings & location" }
        ],
        replies: {
          menu:  "🍽️ Here's our menu:\n\n*Starters* from ₹120\n*Mains* from ₹220\n*Biryani specials* from ₹280\n*Desserts* from ₹80\n\nFull menu: spicegarden.menu",
          book:  "📅 To book a table, please share:\n1. Date & time\n2. Number of guests\n\nOr call us: *+91 98765 43210*",
          hours: "🕐 *Timings:* 11am – 11pm (daily)\n📍 *Location:* MG Road, Vijayawada\n\nGoogle Maps: maps.spicegarden.in"
        }
      },
      salon: {
        name: "Glamour Studio",
        avatar: "GS",
        welcome: "💇 Hi! Welcome to *Glamour Studio*. What would you like to do?",
        buttons: [
          { id: "book",     label: "Book appointment" },
          { id: "services", label: "View services & prices" },
          { id: "hours",    label: "Timings & location" }
        ],
        replies: {
          book:     "📅 We'd love to book you in!\n\nAvailable slots today:\n• 11:00 AM\n• 2:00 PM\n• 4:30 PM\n\nReply with your preferred time!",
          services: "✨ *Our Services:*\n\nHaircut (women) – ₹400\nHair colour – ₹800+\nFacial – ₹600\nManicure – ₹350\nBridal package – ₹4,999\n\nAll prices inclusive of GST.",
          hours:    "🕐 *Open:* 9am – 8pm (Mon–Sat)\n📍 *Address:* Labbipet, Vijayawada\n\n📞 Call: +91 98765 11111"
        }
      },
      clinic: {
        name: "HealthCare Clinic",
        avatar: "HC",
        welcome: "🏥 Hello! Welcome to *HealthCare Clinic*. How can we assist you?",
        buttons: [
          { id: "appt",    label: "Book appointment" },
          { id: "doctors", label: "Our doctors" },
          { id: "hours",   label: "Timings & location" }
        ],
        replies: {
          appt:    "📋 To book an appointment, please share:\n1. Patient name\n2. Department (General / Dental / Skin)\n3. Preferred date & time\n\nOur team will confirm shortly!",
          doctors: "👨‍⚕️ *Our Doctors:*\n\nDr. Ravi Kumar – General Medicine\nDr. Priya Sharma – Dermatology\nDr. Anil Reddy – Dental\n\nAll available Mon–Sat, 9am–6pm.",
          hours:   "🕐 *OPD Hours:* 9am – 6pm\n🚨 *Emergency:* 24/7\n📍 NH Road, Guntur\n\n📞 Emergency: 108"
        }
      },
      retail: {
        name: "TrendMart Shop",
        avatar: "TM",
        welcome: "🛍️ Welcome to *TrendMart*! What are you looking for today?",
        buttons: [
          { id: "catalog", label: "View catalogue" },
          { id: "order",   label: "Place an order" },
          { id: "track",   label: "Track my order" }
        ],
        replies: {
          catalog: "📦 *Our Top Categories:*\n\n👕 Men's wear – from ₹499\n👗 Women's wear – from ₹599\n👟 Footwear – from ₹799\n🎒 Bags & accessories\n\nFull catalogue: trendmart.in/shop",
          order:   "🛒 To place an order:\n1. Share the product name/code\n2. Size & colour\n3. Delivery address\n\nWe'll confirm availability and delivery time within 30 mins!",
          track:   "📍 Please share your *Order ID* and we'll give you a live update right away!\n\nExample: TM-20260521-001"
        }
      }
    };

    let currentScenario = 'restaurant';
    let waitingForReply = false;

    function loadScenario(key, btn) {
      currentScenario = key;
      waitingForReply = false;
      document.querySelectorAll('.sc-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const s = scenarios[key];
      document.getElementById('biz-name').textContent = s.name;
      document.getElementById('biz-avatar').textContent = s.avatar;
      const body = document.getElementById('chat-body');
      body.innerHTML = '';
      setTimeout(() => addRecvMsg(s.welcome, true), 300);
    }

    function resetChat() {
      waitingForReply = false;
      const s = scenarios[currentScenario];
      const body = document.getElementById('chat-body');
      body.innerHTML = '';
      setTimeout(() => addRecvMsg(s.welcome, true), 300);
    }

    function addSentMsg(text) {
      const body = document.getElementById('chat-body');
      const row = document.createElement('div');
      row.className = 'msg-row sent';
      const bubble = document.createElement('div');
      bubble.className = 'bubble sent';
      bubble.innerHTML = formatText(text) + '<span class="time">now ✓✓</span>';
      row.appendChild(bubble);
      body.appendChild(row);
      body.scrollTop = body.scrollHeight;
    }

    function addRecvMsg(text, withButtons) {
      const body = document.getElementById('chat-body');
      const s = scenarios[currentScenario];
      const row = document.createElement('div');
      row.className = 'msg-row recv';
      const bubble = document.createElement('div');
      bubble.className = 'bubble recv';
      bubble.innerHTML = formatText(text) + '<span class="time">now</span>';
      row.appendChild(bubble);
      body.appendChild(row);
      if (withButtons) {
        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group';
        s.buttons.forEach(b => {
          const btn = document.createElement('button');
          btn.className = 'wa-btn';
          btn.innerHTML = `<i class="ti ti-corner-up-left" aria-hidden="true"></i>${b.label}`;
          btn.onclick = () => handleBtn(b.id, b.label, btnGroup);
          btnGroup.appendChild(btn);
        });
        body.appendChild(btnGroup);
      }
      body.scrollTop = body.scrollHeight;
    }

    function handleBtn(id, label, btnGroup) {
      if (waitingForReply) return;
      waitingForReply = true;
      btnGroup.querySelectorAll('.wa-btn').forEach(b => b.disabled = true);
      addSentMsg(label);
      const body = document.getElementById('chat-body');
      const typingRow = document.createElement('div');
      typingRow.className = 'msg-row recv';
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
      typingRow.appendChild(typing);
      body.appendChild(typingRow);
      body.scrollTop = body.scrollHeight;
      setTimeout(() => {
        body.removeChild(typingRow);
        const reply = scenarios[currentScenario].replies[id];
        addRecvMsg(reply, false);
        setTimeout(() => {
          addRecvMsg("Is there anything else I can help you with? 😊", true);
          waitingForReply = false;
        }, 800);
      }, 1500);
    }

    function formatText(text) {
      return text
        .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    loadScenario('restaurant', document.querySelector('.sc-btn.active'));
  </script>

</body>
</html>
